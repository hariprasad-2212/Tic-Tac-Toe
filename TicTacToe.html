<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="TicTacToeCss.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>

    <div id = "game">
        <button class="box" id = "b1"></button>
        <button class="box" id = "b2"></button>
        <button class="box" id = "b3"></button>
        <button class="box" id = "b4"></button>
        <button class="box" id = "b5"></button>
        <button class="box" id = "b6"></button>
        <button class="box" id = "b7"></button>
        <button class="box" id = "b8"></button>
        <button class="box" id = "b9"></button>
    </div>
    <div id = "card">
        <p class="score">X: </p>
        <p class="score" id = "Xscore"></p>
        <p class="score">Draw: </p>
        <p class="score" id= "Draw"></p>
        <p class="score">Y: </p>
        <p class="score" id = "Yscore"></p>
    </div>
    <button id = "Play">Play again</button>
    <div id="popup" class="popup">
        <h2 id="result"></h2>
    </div>
    <script src="TicTacToe.js"></script>

</body>
</html>
